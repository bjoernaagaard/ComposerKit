[licenses]
allow = [
  "MIT",
  "ISC",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

# Only gpui-kit's own dependencies need these licenses, so each is allowed
# for the crate that uses it and nowhere else.

# MPL-2.0: fonts on Windows, a build tool for iOS, and a dependency of dirs-sys.
[[licenses.exceptions]]
crate = "dwrote"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cbindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# CC0-1.0: file watching, and hashing inside const-random.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# 0BSD: enum-iterator and its derive macro.
[[licenses.exceptions]]
crate = "enum-iterator"
allow = ["0BSD"]

[[licenses.exceptions]]
crate = "enum-iterator-derive"
allow = ["0BSD"]

# gpui-kit pulls in crates that RustSec lists as unmaintained, such as paste
# and ttf-parser. Only a crate this workspace depends on directly is ours to
# replace, so only those are reported.
[advisories]
unmaintained = "workspace"
