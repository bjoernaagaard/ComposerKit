[package]
name = "composerkit-ui"
version = "0.1.0"
description = "ComposerKit components for gpui-kit apps"
license = "MIT"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
composerkit-theme.workspace = true
gpui-kit.workspace = true

[features]
profiler = ["gpui-kit/profiler"]

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25.10", default-features = false }

[[example]]
name = "frame_budget"
required-features = ["profiler"]
