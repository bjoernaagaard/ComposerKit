[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# Matches Shrok, whose Blaze build supports Rust 1.99 only.
rust-version = "1.99"
publish = false

[workspace.dependencies]
composerkit-theme = { path = "crates/composerkit-theme", version = "0.1.0" }
gpui-kit = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"

# GPUI is unusably slow at opt-level 0.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
