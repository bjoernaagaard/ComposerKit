# Builds the composerkit npm package and lists the files it would publish,
# so a change that breaks the package build fails before a release. It
# doesn't publish. RELEASING.md has the steps to publish.
name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun pm pack --dry-run
        working-directory: packages/composerkit
