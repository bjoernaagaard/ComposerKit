# Builds the composerkit npm package and lists the files it would publish,
# so a change that breaks the package build fails before a release. It
# doesn't publish. RELEASING.md has the steps to publish.
name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm pack --workspace composerkit --dry-run
