# Publishes the demo and the shadcn registry to GitHub Pages. The demo is at
# https://bjoernaagaard.github.io/ComposerKit/ and the registry under /r, so
# `npx shadcn add https://bjoernaagaard.github.io/ComposerKit/r/composer.json`
# works. The build fails if the committed registry is out of date.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx shadcn build
      - name: Registry matches registry.json
        run: git diff --exit-code -- public/r
      - run: npx vite build --base=/ComposerKit/
      # Pages has no rewrites, so each demo route gets its own copy of the page.
      - name: Add the demo routes
        run: |
          for route in catalog states/composer; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
