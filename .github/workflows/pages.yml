# Publishes the demo and the shadcn registry to GitHub Pages. The demo is at
# https://bjoernaagaard.github.io/ComposerKit/playground/ and the registry
# under /r, so
# `npx shadcn add https://bjoernaagaard.github.io/ComposerKit/r/composer.json`
# works. The build fails if the committed registry is out of date.
# Pull requests run the build only, and nothing is deployed for them.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run registry:build
      - name: Registry matches registry.json
        run: git diff --exit-code -- packages/composerkit/public/r
      - run: bun run build -- --base=/ComposerKit/playground/
      # Pages has no rewrites, so each demo route gets its own copy of the
      # page. /states/composer is the older link to the composer harness.
      - name: Put the registry and the demo in one site
        run: |
          mkdir -p site
          cp -R packages/composerkit/public/r site/r
          cp -R apps/playground/dist site/playground
          for route in playground/states/composer states/composer; do
            mkdir -p "site/$route"
            cp apps/playground/dist/index.html "site/$route/index.html"
          done
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
