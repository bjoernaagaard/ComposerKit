# Publishes the docs site, the demo and the shadcn registry to GitHub Pages.
# The docs are at https://bjoernaagaard.github.io/ComposerKit/, the demo under
# /playground and the registry under /r, so
# `npx shadcn add https://bjoernaagaard.github.io/ComposerKit/r/composer.json`
# works. The build fails if the committed registry is out of date.
# Pull requests run the build only, and nothing is deployed for them.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run registry:build
      - name: Registry matches registry.json
        run: git diff --exit-code -- apps/docs/public/r
      # The docs export is the site root. Next copies public/r into it, so the
      # registry keeps its /r URLs.
      - run: npm run build --workspace @composerkit/docs
        env:
          NEXT_PUBLIC_BASE_PATH: /ComposerKit
      - run: npm run build --workspace @composerkit/playground -- --base=/ComposerKit/playground/
      # Pages has no rewrites, so each demo route gets its own copy of the
      # page. /states/composer is the older link to the composer harness.
      - name: Add the demo under /playground
        run: |
          cp -R apps/playground/dist apps/docs/out/playground
          for route in playground/states/composer states/composer; do
            mkdir -p "apps/docs/out/$route"
            cp apps/playground/dist/index.html "apps/docs/out/$route/index.html"
          done
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
